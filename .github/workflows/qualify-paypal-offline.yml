name: Qualify PayPal Catalog Gate Offline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paypal-catalog-gate-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run offline qualification harness
        timeout-minutes: 11
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 -B .ci/qualify.py

      - name: Reconcile and remove job container
        if: always()
        timeout-minutes: 1
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          case "${GITHUB_RUN_ID:-}" in (''|*[!0-9]*) exit 1 ;; esac
          case "${GITHUB_RUN_ATTEMPT:-}" in (''|*[!0-9]*) exit 1 ;; esac
          CNAME="cg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IDS="$(docker ps -aq --filter "name=^/${CNAME}$" --filter "label=cg.run=${CNAME}" || true)"
          if [ -n "${IDS}" ]; then
            docker rm -f "${CNAME}" >/dev/null 2>&1 || true
          fi
